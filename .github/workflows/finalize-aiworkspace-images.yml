name: Finalize AI Workspace image migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-aiworkspace-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy Base64 image loaders
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'aiworkspace.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replace(/\s*<script src="assets\/aiworkspace-img-[^"]+\.js"><\/script>/g, '');
          fs.writeFileSync(path, html);
          NODE

          rm -f \
            assets/aiworkspace-img-handoff-1.js \
            assets/aiworkspace-img-handoff-2.js \
            assets/aiworkspace-img-overview-1.js \
            assets/aiworkspace-img-overview-2.js \
            assets/aiworkspace-img-newtask.js \
            assets/aiworkspace-img-task-1.js \
            assets/aiworkspace-img-task-2.js

          rm -f \
            .github/workflows/materialize-aiworkspace-images.yml \
            .github/workflows/finalize-aiworkspace-images.yml

      - name: Commit migration cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Finish AI Workspace static image migration"
          git push origin HEAD:main
