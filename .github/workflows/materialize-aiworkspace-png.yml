name: Materialize AI Workspace source PNGs

on:
  push:
    paths:
      - '.png-materialize/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original PNG screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -f .png-materialize/READY || exit 0

          cat .png-materialize/task.*.b64 | tr -d '\n\r' | base64 -d > assets/aiworkspace-task-0023.png
          cat .png-materialize/handoff.*.b64 | tr -d '\n\r' | base64 -d > assets/aiworkspace-handoff.png
          cat .png-materialize/overview.*.b64 | tr -d '\n\r' | base64 -d > assets/aiworkspace-overview.png
          cat .png-materialize/newtask.*.b64 | tr -d '\n\r' | base64 -d > assets/aiworkspace-newtask.png

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/aiworkspace.js')
          s = p.read_text()
          s = s.replace("handoff:'assets/aiworkspace-handoff.webp'", "handoff:'assets/aiworkspace-handoff.png'")
          s = s.replace("overview:'assets/aiworkspace-overview.webp'", "overview:'assets/aiworkspace-overview.png'")
          s = s.replace("newtask:'assets/aiworkspace-newtask.webp'", "newtask:'assets/aiworkspace-newtask.png'")
          s = s.replace('src="assets/aiworkspace-task-0023.webp"', 'src="assets/aiworkspace-task-0023.png"')
          s = s.replace('max-width:1180px!important', 'max-width:1246px!important')
          p.write_text(s)

          h = Path('aiworkspace.html')
          html = h.read_text()
          html = re.sub(r'<script src="assets/aiworkspace\.js(?:\?[^\"]*)?"></script>', '<script src="assets/aiworkspace.js?v=20260821-png1"></script>', html)
          h.write_text(html)
          PY

          rm -f assets/aiworkspace-task-0023.webp assets/aiworkspace-handoff.webp assets/aiworkspace-overview.webp assets/aiworkspace-newtask.webp
          rm -rf .png-materialize
          rm -f .github/workflows/materialize-aiworkspace-png.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace AI Workspace screenshots with source PNGs'
          git push
