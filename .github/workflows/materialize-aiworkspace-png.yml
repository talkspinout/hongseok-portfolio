name: Materialize AI Workspace Task source PNG

on:
  push:
    paths:
      - '.png8/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source Task screenshot and fix proof sizing
        shell: bash
        run: |
          set -euo pipefail
          test -f .png8/READY || exit 0

          cat .png8/task.*.b64 | tr -d '\n\r' | base64 -d > assets/aiworkspace-task-0023.png
          echo 'f4d79ef3745eb50dde1761be01219431ccc61a7411295443defc5305f244fb34  assets/aiworkspace-task-0023.png' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/aiworkspace.js')
          s = p.read_text()
          s = s.replace('src="assets/aiworkspace-task-0023.webp"', 'src="assets/aiworkspace-task-0023.png"')
          s = s.replace('max-width:1180px!important', 'max-width:1246px!important')
          s = s.replace(
              '.proof-shot img{width:100%!important;height:auto!important;aspect-ratio:600/317!important;object-fit:cover!important;object-position:top!important}',
              '.proof-shot img{display:block!important;width:100%!important;height:auto!important;aspect-ratio:auto!important;object-fit:contain!important;object-position:center top!important;image-rendering:auto!important}'
          )
          p.write_text(s)

          h = Path('aiworkspace.html')
          html = h.read_text()
          html = re.sub(r'<script src="assets/aiworkspace\.js(?:\?[^\"]*)?"></script>', '<script src="assets/aiworkspace.js?v=20260822-imgfix2"></script>', html)
          h.write_text(html)
          PY

          rm -f assets/aiworkspace-task-0023.webp
          rm -rf .png8 .png-materialize
          rm -f .github/workflows/materialize-aiworkspace-png.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore sharp Task screenshot and proof image sizing'
          git push
