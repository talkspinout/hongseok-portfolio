name: Integrate AI Workspace into portfolio

on:
  push:
    paths:
      - '.integrate-aiworkspace/READY'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update portfolio navigation and surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f .integrate-aiworkspace/READY || exit 0

          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- main.js: Marketing Lab GNB order ----------
          p = Path('assets/main.js')
          s = p.read_text()
          old = '''      '<a class="nav-item nav-subitem" data-page="marketing-funnel" href="marketing-funnel.html" data-track="navigation" data-track-id="nav_marketing_funnel" data-track-location="gnb"><span aria-hidden="true">-</span> 마케팅 퍼널 운영 프레임워크</a>' +\n      '<a class="nav-item nav-subitem" data-page="think2brief" href="think2brief-story.html" data-track="navigation" data-track-id="nav_think2brief" data-track-location="gnb"><span aria-hidden="true">-</span> Think2Brief 제작기</a>' +\n      '<a class="nav-item nav-subitem" data-page="creepypasta" href="creepypasta-story.html" data-track="navigation" data-track-id="nav_creepypasta" data-track-location="gnb"><span aria-hidden="true">-</span> 괴담통보망 제작기</a>' +'''
          new = '''      '<a class="nav-item nav-subitem" data-page="think2brief" href="think2brief-story.html" data-track="navigation" data-track-id="nav_think2brief" data-track-location="gnb"><span aria-hidden="true">-</span> Think2Brief 제작기</a>' +\n      '<a class="nav-item nav-subitem" data-page="aiworkspace" href="aiworkspace.html" data-track="navigation" data-track-id="nav_aiworkspace" data-track-location="gnb"><span aria-hidden="true">-</span> AI Workspace 제작기</a>' +\n      '<a class="nav-item nav-subitem" data-page="marketing-funnel" href="marketing-funnel.html" data-track="navigation" data-track-id="nav_marketing_funnel" data-track-location="gnb"><span aria-hidden="true">-</span> 마케팅 퍼널 운영 프레임워크</a>' +\n      '<a class="nav-item nav-subitem" data-page="creepypasta" href="creepypasta-story.html" data-track="navigation" data-track-id="nav_creepypasta" data-track-location="gnb"><span aria-hidden="true">-</span> 괴담통보망 제작기</a>' +'''
          if old not in s:
              raise SystemExit('main.js GNB block not found')
          s = s.replace(old, new, 1)
          s = s.replace('"think2brief" | "creepypasta"', '"think2brief" | "aiworkspace" | "creepypasta"')
          p.write_text(s)

          # ---------- data.js: Lab cards / requested order ----------
          p = Path('assets/data.js')
          s = p.read_text()
          lab_block = '''const LAB_ITEMS = [
            {
              type: "project",
              title: "Think2Brief — Marketing",
              desc: "판단과 근거를 카드로 쌓고, 목표·근거·전략·활동의 논리 연결을 점검한 뒤 브리프로 정리하는 실무 사고 흐름을 그대로 옮긴 Chrome 확장 프로그램입니다. 기획 의도부터 제작 방식, AI 협업자의 평가까지 만든 과정을 정리했습니다.",
              link: "think2brief-story.html",
              linkLabel: "제작기 보기",
            },
            {
              type: "project",
              title: "AI Workspace",
              desc: "여러 AI를 오가며 작업할 때 맥락이 끊기는 문제에서 시작한 Task 중심 Workspace입니다. Discord에서 Task를 만들고, Handoff로 다음 Agent에게 넘기며, Admin에서 같은 상태를 확인하는 흐름을 정리했습니다.",
              link: "aiworkspace.html",
              linkLabel: "제작기 보기",
              banner: "assets/aiworkspace-lab-banner.svg",
              bannerAlt: "Discord에서 Task와 Handoff를 거쳐 다음 AI가 작업을 이어받는 AI Workspace 흐름",
            },
            {
              type: "framework",
              title: "마케팅 퍼널 운영 프레임워크: B2C부터 B2B SaaS까지",
              desc: "B2C 커머스·앱, B2B 전통·SaaS 네 개 도메인의 퍼널 운영 방식을 하나의 구조로 정리한 문서입니다. 업무 방식 참고용으로 공개하며, 현황을 직접 체크해 볼 수 있는 도구도 함께 제공합니다.",
              link: "marketing-funnel.html",
              linkLabel: "프레임워크 보기",
            },
            {
              type: "project",
              title: "괴담통보망",
              desc: "생년월일과 오늘 날짜에 따라 다른 괴담이 도착하는 개인화 콘텐츠 서비스입니다. 운세를 결과로 보여주는 대신, 어떤 괴담을 보여줄지 정하는 규칙으로 사용했습니다. 기획 의도부터 콘텐츠 설계, AI와의 작업 방식까지 만든 과정을 정리했습니다.",
              link: "creepypasta-story.html",
              linkLabel: "제작기 보기",
              banner: "assets/creepypasta-hero-teaser.png",
              bannerAlt: "괴담통보망 실제 통보문 화면 일부",
            },
          ];'''
          s, n = re.subn(r'const LAB_ITEMS = \[.*?\n\];(?=\n\n/\* ------------------------------------------------------------\n   7\.)', lab_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('data.js LAB_ITEMS block not found')
          p.write_text(s)

          # ---------- index.html: black CTA banner ----------
          p = Path('index.html')
          s = p.read_text()
          if 'data-track-id="view_aiworkspace_story"' not in s:
              marker = '''        <div class="cta-band reveal">\n          <div>\n            <h3>생년월일과 오늘 날짜가'''
              if marker not in s:
                  raise SystemExit('index.html creepypasta CTA marker not found')
              block = '''        <div class="cta-band reveal">
          <div>
            <h3>여러 AI를 하나의 Task로
이어 쓰는 Workspace를 만들었습니다.</h3>
            <p>Discord에서 Task를 만들고, Handoff로 다음 Agent에게 넘기며, Admin에서 같은 상태를 확인하는 개인 프로젝트입니다.</p>
          </div>
          <div class="cta-actions">
            <a class="btn btn-mint" href="aiworkspace.html" data-track="cta" data-track-id="view_aiworkspace_story" data-track-location="home_bottom">제작기 보기 <span class="arrow">→</span></a>
            <a class="btn btn-line" href="https://www.youtube.com/watch?v=lg5cbHGhoUI" target="_blank" rel="noopener" data-track="cta" data-track-id="view_aiworkspace_demo" data-track-location="home_bottom">시연 영상 <span class="arrow">→</span></a>
          </div>
        </div>

'''
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          # ---------- aiworkspace.html: common site chrome ----------
          p = Path('aiworkspace.html')
          s = p.read_text()
          if 'assets/style.css' not in s:
              s = s.replace('<link href="assets/aiworkspace.css" rel="stylesheet"/>', '<link href="assets/style.css" rel="stylesheet"/>\n<link href="assets/aiworkspace.css" rel="stylesheet"/>', 1)
          if 'assets/data.js' not in s:
              s = s.replace('<script src="assets/analytics.js"></script>', '<script src="assets/data.js"></script>\n<script src="assets/analytics.js"></script>', 1)
          s = s.replace('<body>', '<body data-page="aiworkspace">', 1)
          s = re.sub(r'<header class="topbar">.*?</header>', '''<header class="topbar">
<button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="gnb" aria-label="메뉴 열기">
<span></span><span></span><span></span>
</button>
<a class="gnb-logo" href="index.html" data-track="navigation" data-track-id="brand_home" data-track-location="topbar" aria-label="홈으로 이동"><span class="dot"></span>고홍석 · Marketing Portfolio</a>
</header>
<nav class="gnb" id="gnb" aria-label="사이트 메뉴"></nav>''', s, count=1, flags=re.S)
          common_footer = '''<div class="wrap aiworkspace-site-footer-wrap">
<footer>
<div>© 2026 Hongseok Ko. All rights reserved.</div>
<div class="social-row" data-social></div>
</footer>
</div>'''
          s, n = re.subn(r'<footer class="footer">.*?</footer>', common_footer, s, count=1, flags=re.S)
          if n != 1 and 'aiworkspace-site-footer-wrap' not in s:
              raise SystemExit('aiworkspace.html old footer not found')
          # ensure shared main.js runs before page-specific JS
          if 'assets/main.js' not in s:
              s = re.sub(r'<script src="assets/aiworkspace\.js(?:\?[^\"]*)?"></script>', '<script src="assets/main.js"></script>\n<script src="assets/aiworkspace.js?v=20260822-site1"></script>', s, count=1)
          else:
              s = re.sub(r'<script src="assets/aiworkspace\.js(?:\?[^\"]*)?"></script>', '<script src="assets/aiworkspace.js?v=20260822-site1"></script>', s, count=1)
          p.write_text(s)

          # ---------- aiworkspace.css: keep white page, unify header while preserving page design ----------
          p = Path('assets/aiworkspace.css')
          s = p.read_text()
          start = '/* PORTFOLIO-SHELL-INTEGRATION:START */'
          end = '/* PORTFOLIO-SHELL-INTEGRATION:END */'
          block = '''/* PORTFOLIO-SHELL-INTEGRATION:START */
body[data-page="aiworkspace"]{background:#fff!important}
body[data-page="aiworkspace"] .topbar{display:flex!important;position:sticky!important;top:0!important;z-index:110!important;height:auto!important;min-height:0!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(8px)!important;border-bottom:1px solid var(--line)!important;padding:14px 24px!important;align-items:center!important;gap:14px!important}
body[data-page="aiworkspace"] .topbar .gnb-logo{margin:0!important;font-size:17px!important;font-weight:800!important;letter-spacing:-.03em!important;display:flex!important;align-items:center!important;gap:8px!important;text-decoration:none!important}
body[data-page="aiworkspace"] .topbar .gnb-logo .dot{width:10px!important;height:10px!important;border-radius:50%!important;background:var(--mint)!important;flex:none!important}
body[data-page="aiworkspace"] .topbar .gnb-logo:hover{color:var(--mint-deep)!important}
body[data-page="aiworkspace"] .aiworkspace-site-footer-wrap{max-width:1180px!important;margin:0 auto!important;padding:0 30px!important}
body[data-page="aiworkspace"] .aiworkspace-site-footer-wrap footer{border-top:1px solid var(--line)!important;padding:36px 0 48px!important}
@media(max-width:640px){body[data-page="aiworkspace"] .topbar{padding:12px 16px!important}body[data-page="aiworkspace"] .topbar .gnb-logo{font-size:14px!important}body[data-page="aiworkspace"] .aiworkspace-site-footer-wrap{padding:0 18px!important}}
/* PORTFOLIO-SHELL-INTEGRATION:END */'''
          if start in s and end in s:
              s = re.sub(re.escape(start) + r'.*?' + re.escape(end), block, s, count=1, flags=re.S)
          else:
              s += '\n\n' + block + '\n'
          p.write_text(s)

          # ---------- stable white Lab banner (SVG) ----------
          Path('assets/aiworkspace-lab-banner.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
          <title id="t">AI Workspace Task-centered workflow</title><desc id="d">Discord, Task, Work, Handoff, Continue workflow</desc>
          <rect width="720" height="360" rx="26" fill="#fff"/>
          <rect x="1" y="1" width="718" height="358" rx="25" fill="none" stroke="#e4eaea"/>
          <text x="34" y="48" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#17918d">TASK-CENTERED WORKFLOW</text>
          <g font-family="Arial,sans-serif" text-anchor="middle">
            <g transform="translate(34 92)"><rect width="112" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="56" y="45" font-size="12" fill="#788397">Input</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Discord</text></g>
            <text x="164" y="150" font-size="22" fill="#9aa8a8">→</text>
            <g transform="translate(182 92)"><rect width="112" height="112" rx="18" fill="#f4fbfb" stroke="#9bc6c5"/><text x="56" y="45" font-size="12" fill="#788397">Core</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Task</text></g>
            <text x="312" y="150" font-size="22" fill="#9aa8a8">→</text>
            <g transform="translate(330 92)"><rect width="112" height="112" rx="18" fill="#f4fbfb" stroke="#9bc6c5"/><text x="56" y="45" font-size="12" fill="#788397">Agent A</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Work</text></g>
            <text x="460" y="150" font-size="22" fill="#9aa8a8">→</text>
            <g transform="translate(478 92)"><rect width="112" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="56" y="45" font-size="12" fill="#788397">Context</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Handoff</text></g>
            <text x="608" y="150" font-size="22" fill="#9aa8a8">→</text>
            <g transform="translate(626 92)"><rect x="-18" width="78" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="21" y="45" font-size="11" fill="#788397">Agent B</text><text x="21" y="72" font-size="15" font-weight="700" fill="#191f1f">Continue</text></g>
          </g>
          <rect x="34" y="238" width="652" height="82" rx="18" fill="#f6f8f8"/>
          <circle cx="60" cy="279" r="6" fill="#2ac1bc"/><text x="78" y="285" font-family="Arial,sans-serif" font-size="15" fill="#445164">Goal · Decisions · Next action remain in the Task.</text>
          </svg>''')

          # ---------- verification ----------
          main = Path('assets/main.js').read_text()
          assert main.index('Think2Brief 제작기') < main.index('AI Workspace 제작기') < main.index('마케팅 퍼널 운영 프레임워크') < main.index('괴담통보망 제작기')
          data = Path('assets/data.js').read_text()
          lab = data[data.index('const LAB_ITEMS = ['):data.index('const GATE = {')]
          assert lab.index('Think2Brief — Marketing') < lab.index('AI Workspace') < lab.index('마케팅 퍼널 운영 프레임워크') < lab.index('괴담통보망')
          idx = Path('index.html').read_text()
          assert 'view_aiworkspace_story' in idx and 'btn btn-mint' in idx
          ai = Path('aiworkspace.html').read_text()
          assert 'data-page="aiworkspace"' in ai and 'id="gnb"' in ai and 'data-social' in ai and 'assets/main.js' in ai
          assert Path('assets/aiworkspace-lab-banner.svg').exists()
          PY

          rm -rf .integrate-aiworkspace
          rm -f .github/workflows/integrate-aiworkspace-portfolio.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose AI Workspace across portfolio site'
          git push
