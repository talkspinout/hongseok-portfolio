name: Materialize AI Workspace image assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-aiworkspace-images.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode legacy image data into WebP files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function runFiles(files) {
            const sandbox = { window: { AIWIMG: {} } };
            for (const file of files) {
              vm.runInNewContext(fs.readFileSync(file, 'utf8'), sandbox, { filename: file });
            }
            return sandbox.window.AIWIMG;
          }

          function writeWebp(target, value) {
            if (!value || typeof value !== 'string') throw new Error(`Missing image data for ${target}`);
            const bytes = Buffer.from(value, 'base64');
            if (bytes.subarray(0, 4).toString('ascii') !== 'RIFF' || bytes.subarray(8, 12).toString('ascii') !== 'WEBP') {
              throw new Error(`Decoded payload is not WebP: ${target}`);
            }
            fs.writeFileSync(target, bytes);
            console.log(`${target}: ${bytes.length} bytes`);
          }

          const handoff = runFiles([
            'assets/aiworkspace-img-handoff-1.js',
            'assets/aiworkspace-img-handoff-2.js'
          ]);
          const overview = runFiles([
            'assets/aiworkspace-img-overview-1.js',
            'assets/aiworkspace-img-overview-2.js'
          ]);
          const newtask = runFiles(['assets/aiworkspace-img-newtask.js']);
          const task = runFiles([
            'assets/aiworkspace-img-task-1.js',
            'assets/aiworkspace-img-task-2.js'
          ]);

          writeWebp('assets/aiworkspace-handoff.webp', handoff.handoff);
          writeWebp('assets/aiworkspace-overview.webp', overview.overview);
          writeWebp('assets/aiworkspace-newtask.webp', newtask.newtask);
          writeWebp('assets/aiworkspace-task-0023.webp', task.task);
          NODE

      - name: Commit generated image assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aiworkspace-handoff.webp assets/aiworkspace-overview.webp assets/aiworkspace-newtask.webp assets/aiworkspace-task-0023.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Materialize AI Workspace WebP assets"
          git push origin HEAD:main
