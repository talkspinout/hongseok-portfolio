name: Sharpen AI Workspace screenshots

on:
  push:
    paths:
      - '.aiworkspace-assets/READY'

permissions:
  contents: write

jobs:
  sharpen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sharpen and resize screenshots
        shell: bash
        run: |
          set -euo pipefail
          test -f .aiworkspace-assets/READY || exit 0
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          assets = [
              Path('assets/aiworkspace-task-0023.webp'),
              Path('assets/aiworkspace-handoff.webp'),
              Path('assets/aiworkspace-overview.webp'),
              Path('assets/aiworkspace-newtask.webp'),
          ]

          for path in assets:
              with Image.open(path) as im:
                  im = im.convert('RGB')
                  w, h = im.size
                  scaled = im.resize((w * 2, h * 2), Image.Resampling.LANCZOS)
                  scaled = scaled.filter(ImageFilter.UnsharpMask(radius=0.8, percent=115, threshold=2))
                  scaled.save(path, 'WEBP', lossless=True, method=6)
                  print(path, (w, h), '->', scaled.size)

          js = Path('assets/aiworkspace.js')
          s = js.read_text()
          s = s.replace(
              '.task-focus-crop{width:100%!important;max-width:none!important;height:auto!important;overflow:hidden!important;background:#fff!important;border-radius:11px!important}',
              '.task-focus-crop{width:100%!important;max-width:1180px!important;margin-left:auto!important;margin-right:auto!important;height:auto!important;overflow:hidden!important;background:#fff!important;border-radius:11px!important}'
          )
          s = s.replace(
              '.proof-shot img{height:190px!important}',
              '.proof-shot img{width:100%!important;height:auto!important;aspect-ratio:600/317!important;object-fit:cover!important;object-position:top!important}'
          )
          js.write_text(s)
          PY

          rm -rf .aiworkspace-assets
          rm -f .github/workflows/materialize-aiworkspace-images.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/aiworkspace-task-0023.webp assets/aiworkspace-handoff.webp assets/aiworkspace-overview.webp assets/aiworkspace-newtask.webp assets/aiworkspace.js .aiworkspace-assets .github/workflows/materialize-aiworkspace-images.yml
          git commit -m 'Sharpen AI Workspace screenshots and sizing' || exit 0
          git push
