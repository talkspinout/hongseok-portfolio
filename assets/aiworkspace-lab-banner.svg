<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Workspace Task-centered workflow</title>
  <desc id="desc">Discord에서 Task, Work, Handoff를 거쳐 다음 AI가 작업을 이어받는 흐름</desc>
  <rect width="720" height="360" rx="26" fill="#ffffff"/>
  <rect x="1" y="1" width="718" height="358" rx="25" fill="none" stroke="#e4eaea"/>
  <text x="34" y="48" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#17918d">TASK-CENTERED WORKFLOW</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(34 92)"><rect width="112" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="56" y="45" font-size="12" fill="#788397">Input</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Discord</text></g>
    <text x="164" y="150" font-size="22" fill="#9aa8a8">→</text>
    <g transform="translate(182 92)"><rect width="112" height="112" rx="18" fill="#f4fbfb" stroke="#9bc6c5"/><text x="56" y="45" font-size="12" fill="#788397">Core</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Task</text></g>
    <text x="312" y="150" font-size="22" fill="#9aa8a8">→</text>
    <g transform="translate(330 92)"><rect width="112" height="112" rx="18" fill="#f4fbfb" stroke="#9bc6c5"/><text x="56" y="45" font-size="12" fill="#788397">Agent A</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Work</text></g>
    <text x="460" y="150" font-size="22" fill="#9aa8a8">→</text>
    <g transform="translate(478 92)"><rect width="112" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="56" y="45" font-size="12" fill="#788397">Context</text><text x="56" y="72" font-size="18" font-weight="700" fill="#191f1f">Handoff</text></g>
    <text x="608" y="150" font-size="22" fill="#9aa8a8">→</text>
    <g transform="translate(626 92)"><rect x="-18" width="78" height="112" rx="18" fill="#f8fafa" stroke="#e4eaea"/><text x="21" y="45" font-size="11" fill="#788397">Agent B</text><text x="21" y="72" font-size="15" font-weight="700" fill="#191f1f">Continue</text></g>
  </g>
  <rect x="34" y="238" width="652" height="82" rx="18" fill="#f6f8f8"/>
  <circle cx="60" cy="279" r="6" fill="#2ac1bc"/>
  <text x="78" y="285" font-family="Arial, sans-serif" font-size="15" fill="#445164">Goal · Decisions · Next action remain in the Task.</text>
</svg>
